<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Publications</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="resources/tools.css">

  <!-- Tabulator provides its own table layout. -->
  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/tabulator/6.3.1/css/tabulator.min.css"
    rel="stylesheet"
  />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tabulator/6.3.1/js/tabulator.min.js"></script>

  <style>
    :root {
      --tool-width: 1500px;
    }

    .tool-content {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .muted-small {
      color: var(--tool-muted);
      font-size: 14px;
    }

    .control-strip {
      display: flex;
      align-items: end;
      flex-wrap: wrap;
      gap: 20px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .search-group {
      flex: 1 1 280px;
    }

    #q {
      width: 100%;
    }

    #year {
      width: 160px;
    }

    #status {
      margin: 0 0 12px;
    }

    #pub-table {
      width: 100%;
    }

    .status-danger {
      color: var(--tool-danger);
    }

    /* Tabulator owns table geometry; only its palette and typography are themed. */
    .tabulator {
      border: 0;
      border-top: 1px solid var(--tool-border);
      background: #fff;
      font: 14px/1.5 var(--tool-font);
    }

    .tabulator .tabulator-header, .tabulator .tabulator-header .tabulator-col {
      background: #fff;
      color: var(--tool-muted);
      border-color: var(--tool-border);
      font-weight: 500;
    }

    .tabulator .tabulator-header .tabulator-col .tabulator-col-content {
      padding: 12px 8px;
    }

    .tabulator .tabulator-row {
      background: #fff;
      color: var(--tool-text);
      border-bottom: 1px solid var(--tool-border);
    }

    .tabulator .tabulator-row.tabulator-row-even {
      background: var(--tool-subtle);
    }

    .tabulator .tabulator-row .tabulator-cell {
      padding: 12px 8px;
      border-right: 0;
    }

    .tabulator .tabulator-cell[tabulator-field="title"] {
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .tabulator .tabulator-responsive-collapse table {
      width: 100%;
      table-layout: fixed;
    }

    .tabulator .tabulator-responsive-collapse td {
      padding: 6px 8px;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .tabulator .tabulator-responsive-collapse td:first-child {
      width: 110px;
      color: var(--tool-muted);
    }

    .tabulator .tabulator-footer {
      background: #fff;
      color: var(--tool-muted);
      border-top-color: var(--tool-border);
    }

    .tabulator .tabulator-footer .tabulator-page {
      min-height: 44px;
      padding: 8px 12px;
      border-color: var(--tool-border);
      border-radius: 0;
    }

    .tabulator .tabulator-footer .tabulator-page.active {
      color: var(--tool-accent);
      border-color: var(--tool-accent);
    }

    .tabulator .tabulator-tableholder .tabulator-table {
      background: #fff;
      color: var(--tool-text);
    }

    /* Tabulator suppresses the shared outline; keep it visible inside clipped areas. */
    #pub-table :focus-visible {
      outline: 2px solid var(--tool-accent);
      outline-offset: -2px;
    }

    @media (hover: hover) {
      .tabulator .tabulator-row.tabulator-selectable:hover {
        background: var(--tool-subtle);
      }
    }

    @media (max-width: 600px) {
      .control-group, #q, #year, .button-link {
        width: 100%;
      }
      .tabulator .tabulator-footer .tabulator-footer-contents {
        flex-wrap: wrap;
        gap: 12px;
      }
      .tabulator .tabulator-footer .tabulator-paginator {
        white-space: normal;
      }
    }
  </style>
</head>

<body>
  <nav class="tool-nav" aria-label="Tools">
    <a class="tool-brand" href="index.html">Personal tools</a>
    <a class="tool-home" href="index.html">All tools</a>
  </nav>
  <div class="tool-shell">

    <div class="tool-content">
      <header class="tool-header">
        <h1>Publications</h1>
        <div class="muted-small">Loaded from <code>/resources/publications.bib</code></div>
      </header>

      <section class="control-strip" aria-label="Publication controls">
        <div class="control-group search-group">
          <label for="q">Search title, author, venue, DOI</label>
          <input id="q" placeholder="Type to filter…" />
        </div>
        <div class="control-group">
          <label for="year">Year</label>
          <select id="year">
            <option value="">All years</option>
          </select>
        </div>
        <a id="downloadBib" class="button-link" href="/resources/publications.bib" download>
          Download BibTeX
        </a>
      </section>

      <main class="table-wrap">
        <div id="status" class="status-bar-field" role="status" aria-live="polite" hidden></div>
        <div id="pub-table"></div>
      </main>

      <footer class="status-bar">
        <div class="status-bar-field muted-small">
          Tips: click column headers to sort • type to filter • table is iframe-embeddable
        </div>
        <div class="status-bar-field muted-small">Powered by Tabulator + Citation.js</div>
      </footer>
    </div>
  </div>

  <script type="module">
    // Citation.js (ESM) + BibTeX plugin
    // Pin versions for stability. Citation.js releases/bundles are documented by the project.  [oai_citation:2‡citation.js.org](https://citation.js.org/api/0.3/tutorial-getting_started.html?utm_source=chatgpt.com)
    // plugin-bibtex is part of the citation-js npm org.  [oai_citation:3‡npm](https://www.npmjs.com/org/citation-js?utm_source=chatgpt.com)
    import { Cite } from "https://cdn.jsdelivr.net/npm/@citation-js/core@0.7.21/+esm";
    import "https://cdn.jsdelivr.net/npm/@citation-js/plugin-bibtex@0.7.21/+esm";

    const statusEl = document.getElementById("status");
    const qEl = document.getElementById("q");
    const yearEl = document.getElementById("year");

    function setStatus(msg, kind = "info") {
      statusEl.className = `status-bar-field status-${kind}`;
      statusEl.setAttribute("role", kind === "danger" ? "alert" : "status");
      statusEl.textContent = msg;
      statusEl.hidden = false;
    }
    function clearStatus() {
      statusEl.hidden = true;
      statusEl.textContent = "";
    }

    function safeText(x) {
      if (!x) return "";
      return String(x).replace(/\s+/g, " ").trim();
    }

    function formatAuthors(cslItem) {
      const authors = cslItem.author || [];
      if (!authors.length) return "";

      // CSL-JSON authors look like {given, family} or {literal}
      return authors.map(a => {
        if (a.literal) return safeText(a.literal);
        const given = safeText(a.given);
        const family = safeText(a.family);
        return [family, given].filter(Boolean).join(", ");
      }).join("; ");
    }

    function getYear(cslItem) {
      // CSL-JSON often has issued: { "date-parts": [[YYYY, MM, DD]] }
      const dp = cslItem?.issued?.["date-parts"]?.[0];
      if (dp && dp[0]) return String(dp[0]);
      // fallback: sometimes "published-print"/"published-online"
      const dp2 = cslItem?.["published-online"]?.["date-parts"]?.[0] || cslItem?.["published-print"]?.["date-parts"]?.[0];
      if (dp2 && dp2[0]) return String(dp2[0]);
      return "";
    }

    function getVenue(cslItem) {
      // journal container-title
      return safeText(cslItem["container-title"] || cslItem["publisher"] || "");
    }

    function getVolumeIssuePages(cslItem) {
      const vol = safeText(cslItem.volume);
      const iss = safeText(cslItem.issue);
      const page = safeText(cslItem.page);
      const bits = [];
      if (vol) bits.push(`Vol ${vol}`);
      if (iss) bits.push(`(${iss})`);
      if (page) bits.push(`pp. ${page}`);
      return bits.join(" ");
    }

    function doiUrl(doi) {
      doi = safeText(doi).replace(/^https?:\/\/doi\.org\//i, "");
      if (!doi) return "";
      return `https://doi.org/${doi}`;
    }

    function parseOrcidsFromAuthorString(authorStr) {
      // If your BibTeX has authors like: "Name (0000-0000-0000-0000)"
      // we surface ORCIDs if present (simple heuristic).
      const matches = [];
      const re = /\((\d{4}-\d{4}-\d{4}-\d{3}[\dX])\)/g;
      let m;
      while ((m = re.exec(authorStr)) !== null) matches.push(m[1]);
      return matches;
    }

    // Build Tabulator
    const table = new Tabulator("#pub-table", {
      layout: "fitColumns",
      responsiveLayout: "collapse",
      responsiveLayoutCollapseStartOpen: true,
      pagination: true,
      paginationSize: 10,
      paginationSizeSelector: [10, 20, 50, 100],
      placeholder: "No publications to display.",
      columns: [
        { title: "Year", field: "year", width: 90, sorter: "number", hozAlign: "left", responsive: 1 },
        {
          title: "Title",
          field: "title",
          sorter: "string",
          minWidth: 180,
          responsive: 0,
          variableHeight: true,
          formatter: (cell) => {
            const row = cell.getRow().getData();
            const title = safeText(row.title);
            const url = safeText(row.url);
            if (url) {
              const a = document.createElement("a");
              a.href = url;
              a.target = "_blank";
              a.rel = "noopener noreferrer";
              a.textContent = title || "(untitled)";
              return a;
            }
            return title || "(untitled)";
          },
          widthGrow: 3
        },
        { title: "Authors", field: "authors", sorter: "string", widthGrow: 2, minWidth: 180, responsive: 2 },
        { title: "Venue", field: "venue", sorter: "string", widthGrow: 1.5, minWidth: 150, responsive: 3 },
        {
          title: "Vol/Issue/Pages",
          field: "vip",
          sorter: "string",
          widthGrow: 1.2,
          minWidth: 160,
          responsive: 4
        },
        {
          title: "DOI",
          field: "doi",
          sorter: "string",
          formatter: (cell) => {
            const doi = safeText(cell.getValue());
            if (!doi) return "";
            const url = doiUrl(doi);
            return `<a href="${url}" target="_blank" rel="noopener noreferrer">${doi}</a>`;
          },
          widthGrow: 1.2,
          minWidth: 160,
          responsive: 5
        }
      ],
      initialSort: [
        { column: "year", dir: "desc" }
      ],
    });

    function applyFilters() {
      const q = safeText(qEl.value).toLowerCase();
      const y = safeText(yearEl.value);

      table.setFilter((data) => {
        if (y && data.year !== y) return false;
        if (!q) return true;

        const hay = [
          data.title,
          data.authors,
          data.venue,
          data.doi,
          data.vip
        ].map(s => safeText(s).toLowerCase()).join(" • ");

        return hay.includes(q);
      });
    }

    qEl.addEventListener("input", applyFilters);
    yearEl.addEventListener("change", applyFilters);

    async function loadBib() {
      setStatus("Loading publications…");

      let bibText = "";
      try {
        const res = await fetch("/resources/publications.bib", { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status} fetching /resources/publications.bib`);
        bibText = await res.text();
      } catch (err) {
        setStatus(
          "Could not load /resources/publications.bib. " +
          "Check the file path and that the site serves it (same-origin). " +
          `Details: ${err.message}`,
          "danger"
        );
        return;
      }

      let cite;
      try {
        cite = new Cite(bibText);
      } catch (err) {
        setStatus("BibTeX parsing failed. Please validate the .bib file. Details: " + err.message, "danger");
        return;
      }

      // Citation.js yields CSL-JSON items in cite.data
      const items = (cite.data || []).map((csl) => {
        const year = getYear(csl);
        const title = safeText(csl.title);
        const authors = formatAuthors(csl);
        const venue = getVenue(csl);
        const vip = getVolumeIssuePages(csl);
        const doi = safeText(csl.DOI || csl.doi || "");
        const url = safeText(csl.URL || doiUrl(doi));

        // Optional: surface ORCID presence if embedded in BibTeX author string.
        // (Citation.js may preserve that in author literals depending on BibTeX format.)
        const orcids = parseOrcidsFromAuthorString(authors);

        return {
          year,
          title,
          authors,
          venue,
          vip,
          doi,
          url,
          orcids
        };
      });

      // Populate year dropdown
      const years = Array.from(new Set(items.map(i => i.year).filter(Boolean)))
        .sort((a, b) => Number(b) - Number(a));
      for (const y of years) {
        const opt = document.createElement("option");
        opt.value = y;
        opt.textContent = y;
        yearEl.appendChild(opt);
      }

      table.setData(items);
      clearStatus();
      applyFilters();
    }

    loadBib();
  </script>
</body>
</html>
