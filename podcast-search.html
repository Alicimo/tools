<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Podcast Episode Search</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link href="resources/98-css/98.css" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --panel-gap: 12px;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .app-window { width: min(960px, 100%); margin: 0 auto; }
    .window-body { padding: 8px; }
    .app-heading { margin: 0 0 4px; font-size: 1.5rem; }
    .app-description { margin: 0 0 12px; }
    .search-panel { padding: 10px; }
    .search-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .search-row label { flex: 0 0 auto; }
    .search-row input { flex: 1 1 auto; min-width: 0; }
    .random-button { white-space: nowrap; }
    .duration-filter {
      margin-top: 10px;
      min-width: 0;
    }
    .duration-labels, .duration-scale {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }
    .duration-slider {
      position: relative;
      height: 40px;
      margin: 0 12px;
      --range-start: 14.2857%;
      --range-end: 42.8571%;
    }
    .duration-track {
      position: absolute;
      top: 18px;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(to right,
        #aaa var(--range-start), #000080 var(--range-start),
        #000080 var(--range-end), #aaa var(--range-end));
    }
    .duration-slider input[type="range"] {
      position: absolute;
      inset: 0;
      width: calc(100% + 24px);
      height: 40px;
      margin: 0 -12px;
      padding: 0;
      background: transparent;
      pointer-events: none;
      appearance: none;
    }
    .duration-slider input[type="range"]::-webkit-slider-runnable-track {
      height: 4px;
      background: transparent;
      border: 0;
      box-shadow: none;
    }
    .duration-slider input[type="range"]::-moz-range-track {
      height: 4px;
      background: transparent;
      border: 0;
      box-shadow: none;
    }
    .duration-slider input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      width: 24px;
      height: 24px;
      margin-top: -10px;
      transform: none;
      border: 2px solid #000080;
      border-radius: 50%;
      background: #dfdfdf;
      box-shadow: inset 2px 2px #fff, inset -2px -2px #808080;
      pointer-events: auto;
      cursor: ew-resize;
    }
    .duration-slider input[type="range"]::-moz-range-thumb {
      width: 24px;
      height: 24px;
      box-sizing: border-box;
      transform: none;
      border: 2px solid #000080;
      border-radius: 50%;
      background: #dfdfdf;
      box-shadow: inset 2px 2px #fff, inset -2px -2px #808080;
      pointer-events: auto;
      cursor: ew-resize;
    }
    .duration-slider input:focus-visible {
      outline: 1px dotted #000;
      outline-offset: 2px;
      z-index: 1;
    }
    .status-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 8px;
    }
    .result-meta {
      color: #444;
      font-size: 11px;
    }
    .results-list { display: flex; flex-direction: column; gap: var(--panel-gap); margin-top: var(--panel-gap); }
    .result-card {
      padding: 10px;
    }
    .result-title { margin: 0 0 6px; font-size: 1.25rem; }
    .snippet { margin: 0 0 10px; color: #333; }
    .audio-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    audio { width: 100%; }
    .audio-link {
      color: #000080;
    }
    @media (max-width: 600px) {
      body { padding: 8px; }
      .window-body { padding: 6px; }
      .search-row { align-items: stretch; flex-direction: column; }
      .search-row input,
      .random-button { min-height: 36px; width: 100%; }
      .status-row { align-items: flex-start; flex-direction: column; }
      button, input { min-height: 32px; }
    }
  </style>
</head>
<body>
  <main class="window app-window">
    <div class="title-bar">
      <div class="title-bar-text">Podcast Episode Search</div>
    </div>
    <div class="window-body">
      <header>
        <h1 class="app-heading">Podcast Episode Search</h1>
        <p class="app-description">
          Search the complete Thomas and Friends Storytime archive by title and description.
        </p>
      </header>

      <section class="sunken-panel search-panel" aria-label="Episode search">
        <form id="searchForm" role="search">
          <div class="search-row">
            <label for="searchInput">Search</label>
            <input
              id="searchInput"
              type="search"
              placeholder="Type a title, character, or story detail"
              autocomplete="off"
            >
            <button id="randomButton" class="random-button" type="button" disabled>
              Play random
            </button>
          </div>
          <fieldset class="duration-filter">
            <legend>Episode length</legend>
            <div class="duration-labels">
              <label for="durationMin">Min: <output id="durationMinValue" for="durationMin">5 min</output></label>
              <label for="durationMax">Max: <output id="durationMaxValue" for="durationMax">15 min</output></label>
            </div>
            <div id="durationSlider" class="duration-slider">
              <div class="duration-track" aria-hidden="true"></div>
              <input id="durationMin" type="range" min="0" max="35" step="1" value="5"
                     aria-label="Minimum episode length" aria-valuetext="5 minutes">
              <input id="durationMax" type="range" min="0" max="35" step="1" value="15"
                     aria-label="Maximum episode length" aria-valuetext="15 minutes">
            </div>
            <div class="duration-scale" aria-hidden="true">
              <span>0 min</span>
              <span id="durationLimit">35 min</span>
            </div>
          </fieldset>
        </form>
        <div class="status-row">
          <div id="status" class="result-meta">Loading episodes…</div>
          <div id="meta" class="result-meta"></div>
        </div>
      </section>

      <section id="results" class="results-list" aria-live="polite"></section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
  <script>
    const state = {
      episodes: [],
      fuse: null,
      query: ''
    }

    const searchInput = document.getElementById('searchInput')
    const resultsEl = document.getElementById('results')
    const statusEl = document.getElementById('status')
    const metaEl = document.getElementById('meta')
    const randomButton = document.getElementById('randomButton')
    const searchForm = document.getElementById('searchForm')
    const durationMin = document.getElementById('durationMin')
    const durationMax = document.getElementById('durationMax')
    const durationSlider = document.getElementById('durationSlider')
    const durationMinValue = document.getElementById('durationMinValue')
    const durationMaxValue = document.getElementById('durationMaxValue')
    const MAX_SNIPPET = 240

    const setStatus = (message) => {
      statusEl.textContent = message
    }

    const formatDate = (value) => {
      if (!value) return 'Unknown date'
      const date = new Date(value)
      if (Number.isNaN(date.getTime())) return 'Unknown date'
      return date.toLocaleDateString(undefined, {
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      })
    }

    const truncate = (text, max) => {
      if (text.length <= max) return text
      return `${text.slice(0, max)}…`
    }

    const buildSnippet = (text, query) => {
      const cleanText = text || ''
      if (!cleanText) return 'No description available.'
      if (!query) return truncate(cleanText, MAX_SNIPPET)
      const lowerText = cleanText.toLowerCase()
      const lowerQuery = query.toLowerCase()
      const index = lowerText.indexOf(lowerQuery)
      if (index === -1) {
        return truncate(cleanText, MAX_SNIPPET)
      }
      const start = Math.max(0, index - 90)
      const end = Math.min(cleanText.length, index + lowerQuery.length + 140)
      const prefix = start > 0 ? '…' : ''
      const suffix = end < cleanText.length ? '…' : ''
      return prefix + cleanText.slice(start, end) + suffix
    }

    const parseDateValue = (value) => {
      if (!value) return 0
      const date = new Date(value)
      if (Number.isNaN(date.getTime())) return 0
      return date.getTime()
    }

    const formatDuration = (value) => {
      if (value === null || value === undefined) return ''
      const total = Number(value)
      if (!Number.isFinite(total) || total <= 0) return ''
      const hours = Math.floor(total / 3600)
      const minutes = Math.floor((total % 3600) / 60)
      const seconds = Math.floor(total % 60)
      if (hours > 0) {
        return `${hours}h ${minutes.toString().padStart(2, '0')}m`
      }
      return `${minutes}m ${seconds.toString().padStart(2, '0')}s`
    }

    const renderResults = (items, query) => {
      resultsEl.replaceChildren()
      if (!items.length) {
        const emptyCard = document.createElement('div')
        emptyCard.className = 'result-card sunken-panel'
        const emptyTitle = document.createElement('h2')
        emptyTitle.className = 'result-title'
        emptyTitle.textContent = 'No matches found'
        const emptyText = document.createElement('p')
        emptyText.className = 'snippet'
        emptyText.textContent = 'Try another keyword or adjust the episode length range.'
        emptyCard.appendChild(emptyTitle)
        emptyCard.appendChild(emptyText)
        resultsEl.appendChild(emptyCard)
        metaEl.textContent = '0 results'
        return
      }

      items.forEach((item) => {
        const card = document.createElement('article')
        card.className = 'result-card sunken-panel'

        const title = document.createElement('h2')
        title.className = 'result-title'
        title.textContent = item.title || 'Untitled episode'

        const meta = document.createElement('div')
        meta.className = 'result-meta'
        const duration = formatDuration(item.duration)
        meta.textContent = duration
          ? `${formatDate(item.published)} · ${duration}`
          : formatDate(item.published)

        const snippet = document.createElement('p')
        snippet.className = 'snippet'
        snippet.textContent = buildSnippet(item.description, query)

        const audioWrap = document.createElement('div')
        audioWrap.className = 'audio-actions'

        if (item.audio_url) {
          const audio = document.createElement('audio')
          audio.setAttribute('controls', '')
          audio.setAttribute('preload', 'none')
          audio.src = item.audio_url
          audioWrap.appendChild(audio)

          const audioLink = document.createElement('a')
          audioLink.className = 'audio-link'
          audioLink.href = item.audio_url
          audioLink.target = '_blank'
          audioLink.rel = 'noopener noreferrer'
          audioLink.textContent = 'Open audio in new tab'
          audioWrap.appendChild(audioLink)
        } else {
          const noAudio = document.createElement('div')
          noAudio.className = 'result-meta'
          noAudio.textContent = 'Audio link not available for this episode.'
          audioWrap.appendChild(noAudio)
        }

        card.appendChild(title)
        card.appendChild(meta)
        card.appendChild(snippet)
        card.appendChild(audioWrap)
        resultsEl.appendChild(card)
      })

      metaEl.textContent = `${items.length} result${items.length === 1 ? '' : 's'}`
    }

    const buildFuse = (episodes) => {
      return new Fuse(episodes, {
        includeScore: true,
        minMatchCharLength: 2,
        threshold: 0.35,
        keys: [
          { name: 'title', weight: 0.7 },
          { name: 'description', weight: 0.3 }
        ]
      })
    }

    const getSearchResults = (query) => {
      if (!state.fuse) return []
      const results = state.fuse.search(query)
      const mapped = results.map((entry) => ({
        item: entry.item,
        score: entry.score ?? 1
      }))

      mapped.sort((a, b) => {
        const scoreDiff = a.score - b.score
        if (Math.abs(scoreDiff) > 0.05) return scoreDiff
        return parseDateValue(b.item.published) - parseDateValue(a.item.published)
      })

      return mapped.map((entry) => entry.item)
    }

    const getEligibleEpisodes = (query) => {
      const trimmed = query.trim()
      const episodes = trimmed ? getSearchResults(trimmed) : state.episodes
      const minimum = Number(durationMin.value) * 60
      const maximum = Number(durationMax.value) * 60
      return episodes.filter((episode) => {
        const duration = Number(episode.duration)
        return Number.isFinite(duration) && duration > 0
          && duration >= minimum && duration <= maximum
      })
    }

    const pickRandom = (items) => {
      return items[Math.floor(Math.random() * items.length)]
    }

    const tryPlayRenderedAudio = () => {
      const audio = resultsEl.querySelector('audio')
      if (!audio) return
      const playRequest = audio.play()
      if (playRequest && typeof playRequest.catch === 'function') {
        playRequest.catch(() => {})
      }
    }

    const runSearch = (query) => {
      state.query = query
      const trimmed = query.trim()
      if (!state.fuse) {
        renderResults([], trimmed)
        setStatus('Search is not ready yet.')
        return
      }

      renderResults(getEligibleEpisodes(trimmed), trimmed)
      const lengthSummary = ` Episode length: ${durationMin.value}–${durationMax.value} minutes.`
      setStatus((trimmed ? `Showing matches for "${trimmed}".` : 'Browsing episodes.') + lengthSummary)
    }

    const playRandomEpisode = () => {
      window.clearTimeout(debounceTimer)
      const query = searchInput.value
      const trimmed = query.trim()
      state.query = query

      if (!state.episodes.length) {
        renderResults([], trimmed)
        setStatus('Random play is not ready yet.')
        return
      }

      const eligibleEpisodes = getEligibleEpisodes(query)
      if (!eligibleEpisodes.length) {
        renderResults([], trimmed)
        setStatus('No episodes match the current search and length filter.')
        return
      }

      const episode = pickRandom(eligibleEpisodes)
      const selectedTitle = episode.title || 'Untitled episode'
      searchInput.value = selectedTitle
      state.query = selectedTitle
      renderResults([episode], selectedTitle)
      setStatus(trimmed
        ? `Random pick from matches for "${trimmed}".`
        : 'Random pick from the selected episode length range.'
      )
      tryPlayRenderedAudio()
    }

    let debounceTimer
    const handleInput = (event) => {
      const value = event.target.value
      window.clearTimeout(debounceTimer)
      debounceTimer = window.setTimeout(() => runSearch(value), 200)
    }

    const loadEpisodes = async () => {
      try {
        const response = await fetch('resources/episodes.json', { cache: 'no-store' })
        if (!response.ok) {
          throw new Error(`Failed to load episodes.json (${response.status})`)
        }
        const data = await response.json()
        state.episodes = Array.isArray(data.episodes) ? data.episodes : []
        state.fuse = buildFuse(state.episodes)
        randomButton.disabled = !state.episodes.length
        const longestMinutes = state.episodes.reduce((longest, episode) => {
          const duration = Number(episode.duration)
          return Number.isFinite(duration) ? Math.max(longest, Math.ceil(duration / 60)) : longest
        }, 15)
        durationMin.max = longestMinutes
        durationMax.max = longestMinutes
        document.getElementById('durationLimit').textContent = `${longestMinutes} min`
        updateDurationRange()
        runSearch(searchInput.value)
      } catch (error) {
        console.error(error)
        randomButton.disabled = true
        setStatus('Unable to load the local episode dataset.')
        renderResults([], '')
      }
    }

    function updateDurationRange(changedInput) {
      if (Number(durationMin.value) >= Number(durationMax.value)) {
        if (changedInput === durationMin) {
          durationMin.value = Number(durationMax.value) - 1
        } else {
          durationMax.value = Number(durationMin.value) + 1
        }
      }
      durationMinValue.value = `${durationMin.value} min`
      durationMaxValue.value = `${durationMax.value} min`
      durationMin.setAttribute('aria-valuetext', `${durationMin.value} minutes`)
      durationMax.setAttribute('aria-valuetext', `${durationMax.value} minutes`)
      const limit = Number(durationMax.max)
      durationSlider.style.setProperty('--range-start', `${Number(durationMin.value) / limit * 100}%`)
      durationSlider.style.setProperty('--range-end', `${Number(durationMax.value) / limit * 100}%`)
    }

    function handleDurationInput(event) {
      updateDurationRange(event.target)
      window.clearTimeout(debounceTimer)
      debounceTimer = window.setTimeout(() => runSearch(searchInput.value), 100)
    }

    searchInput.addEventListener('input', handleInput)
    durationMin.addEventListener('input', handleDurationInput)
    durationMax.addEventListener('input', handleDurationInput)
    searchForm.addEventListener('submit', (event) => {
      event.preventDefault()
      window.clearTimeout(debounceTimer)
      runSearch(searchInput.value)
    })
    randomButton.addEventListener('click', playRandomEpisode)
    loadEpisodes()
  </script>
</body>
</html>
