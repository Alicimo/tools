<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Snake (Vim / Arrows) — Single-file SPA</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="resources/tools.css">

  <style>
    .tool-shell {
      max-width: 900px;
    }

    .hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 20px;
      padding: 20px 0;
      margin: 24px 0;
      border-block: 1px solid var(--tool-border);
    }

    .control-options, .scores {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
    }

    .control-options label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
    }

    .scores {
      font-variant-numeric: tabular-nums;
    }

    .game-wrap {
      display: grid;
      justify-items: center;
      gap: 20px;
    }

    /* The canvas retains a dark playfield for contrast; all surrounding UI is Editorial. */
    canvas {
      max-width: 100%;
      height: auto;
      background: #252720;
      image-rendering: pixelated;
    }

    .hint {
      max-width: 620px;
      text-align: center;
      font-size: 14px;
      color: var(--tool-muted);
    }

    .d-none {
      display: none;
    }

    kbd {
      padding: 2px 5px;
      border: 1px solid var(--tool-border);
      background: var(--tool-subtle);
      font: 13px/1.4 ui-monospace, monospace;
    }

    dialog {
      width: min(460px, calc(100% - 32px));
      padding: 28px;
      border: 1px solid var(--tool-border);
      background: #fff;
      color: var(--tool-text);
    }

    dialog::backdrop {
      background: rgba(48, 46, 39, .3);
    }

    dialog h2 {
      margin: 0 0 20px;
    }

    .dialog-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: end;
      gap: 12px;
      margin-top: 24px;
    }

    .touch-controls {
      display: grid;
      grid-template-columns: repeat(3, 48px);
      gap: 8px;
    }

    .touch-controls button {
      padding: 8px;
    }

    .touch-controls [data-direction="up"] {
      grid-column: 2;
    }

    .touch-controls [data-direction="left"] {
      grid-column: 1;
    }
  </style>
</head>

<body>
  <nav class="tool-nav" aria-label="Tools">
    <a class="tool-brand" href="index.html">Personal tools</a>
    <a class="tool-home" href="index.html">All tools</a>
  </nav>
  <main class="tool-shell">
    <h1>Vim snake</h1>
    <div class="hud">
      <div class="control-options" role="group" aria-label="Control scheme">
        <label><input type="radio" name="controls" id="controls-vi" checked> Vim (h/j/k/l)</label>
        <label><input type="radio" name="controls" id="controls-arrows"> Arrows</label>
      </div>
      <div class="scores"><span>Score: <strong id="score">0</strong></span><span>High: <strong id="highScore">0</strong></span></div>
      <button id="startGameBtn" class="primary" type="button">Start / restart</button>
    </div>
    <div class="game-wrap">
      <canvas id="game" width="360" height="288" aria-label="Snake game canvas"></canvas>
      <div class="touch-controls" role="group" aria-label="Direction controls">
        <button type="button" data-direction="up" aria-label="Move up">↑</button>
        <button type="button" data-direction="left" aria-label="Move left">←</button>
        <button type="button" data-direction="down" aria-label="Move down">↓</button>
        <button type="button" data-direction="right" aria-label="Move right">→</button>
      </div>
      <div class="hint">
        <span class="controls-hint" data-mode="vi"><kbd>k</kbd> up · <kbd>j</kbd> down · <kbd>h</kbd> left · <kbd>l</kbd> right</span>
        <span class="controls-hint d-none" data-mode="arrows">Use the arrow keys to move.</span>
        <p>Space or Enter to start. Wrapping enabled; speed increases with score.</p>
      </div>
    </div>
  </main>
  <dialog id="gameOverModal" aria-labelledby="gameOverTitle">
    <h2 id="gameOverTitle">Game over</h2>
    <p>Your score: <strong id="finalScore">0</strong></p>
    <p>High score (this session): <strong id="finalHighScore">0</strong></p>
    <div class="dialog-actions"><button type="button" data-close-dialog>Close</button><button type="button" class="primary" id="playAgainBtn">Play again</button></div>
  </dialog>
  <dialog id="winModal" aria-labelledby="winTitle">
    <h2 id="winTitle">You win!</h2>
    <p>Final score: <strong id="winScore">0</strong></p>
    <p>High score (this session): <strong id="winHighScore">0</strong></p>
    <div class="dialog-actions"><button type="button" data-close-dialog>Close</button><button type="button" class="primary" id="winPlayAgainBtn">Play again</button></div>
  </dialog>

  <script>
    (() => {
      // ====== Config (“old Nokia-ish”) ======
      const COLS = 20;
      const ROWS = 16;
      const CELL = 18; // px
      const CANVAS_W = COLS * CELL;
      const CANVAS_H = ROWS * CELL;

      // Speed curve: interval decreases as score rises
      const BASE_INTERVAL_MS = 300;      // starting speed
      const MIN_INTERVAL_MS  = 55;       // cap (fastest)
      const SPEEDUP_PER_FOOD = 10;        // ms faster per point

      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');

      canvas.width = CANVAS_W;
      canvas.height = CANVAS_H;

      // ====== UI Elements ======
      const scoreEl = document.getElementById('score');
      const highScoreEl = document.getElementById('highScore');
      const finalScoreEl = document.getElementById('finalScore');
      const finalHighScoreEl = document.getElementById('finalHighScore');
      const playAgainBtn = document.getElementById('playAgainBtn');
      const winScoreEl = document.getElementById('winScore');
      const winHighScoreEl = document.getElementById('winHighScore');
      const winPlayAgainBtn = document.getElementById('winPlayAgainBtn');

      const controlsArrows = document.getElementById('controls-arrows');
      const controlsVi = document.getElementById('controls-vi');
      const hintArrows = document.querySelector('.controls-hint[data-mode="arrows"]');
      const hintVi = document.querySelector('.controls-hint[data-mode="vi"]');

      // Native dialogs keep game feedback keyboard accessible.
      const gameOverModalEl = document.getElementById('gameOverModal');
      const winModalEl = document.getElementById('winModal');

      // ====== State ======
      let controlMode = 'vi'; // 'arrows' | 'vi'
      let running = false;
      let gameOver = false;

      let score = 0;
      let highScore = 0; // session only (in-memory)

      // Snake is array of {x,y}, head at [0]
      let snake = [];
      let dir = { x: 1, y: 0 };
      let pendingDir = null;

      let food = { x: 0, y: 0 };

      let tickTimer = null;

      // ====== Helpers ======
      const randInt = (min, maxInclusive) => Math.floor(Math.random() * (maxInclusive - min + 1)) + min;

      function setControlMode(mode) {
        controlMode = mode;
        if (mode === 'arrows') {
          hintArrows.classList.remove('d-none');
          hintVi.classList.add('d-none');
        } else {
          hintVi.classList.remove('d-none');
          hintArrows.classList.add('d-none');
        }
      }

      function updateScoreUI() {
        scoreEl.textContent = String(score);
        highScoreEl.textContent = String(highScore);
      }

      function currentIntervalMs() {
        const ms = BASE_INTERVAL_MS - (score * SPEEDUP_PER_FOOD);
        return Math.max(MIN_INTERVAL_MS, ms);
      }

      function clearTimer() {
        if (tickTimer) {
          clearTimeout(tickTimer);
          tickTimer = null;
        }
      }

      function scheduleNextTick() {
        clearTimer();
        if (!running) return;
        tickTimer = setTimeout(() => {
          tick();
          scheduleNextTick();
        }, currentIntervalMs());
      }

      function cellEquals(a, b) { return a.x === b.x && a.y === b.y; }

      function snakeOccupies(x, y) {
        for (const seg of snake) {
          if (seg.x === x && seg.y === y) return true;
        }
        return false;
      }

      function placeFood() {
        // Find a random free cell. Use a bounded attempt count then fall back to scan.
        for (let tries = 0; tries < 200; tries++) {
          const x = randInt(0, COLS - 1);
          const y = randInt(0, ROWS - 1);
          if (!snakeOccupies(x, y)) {
            food = { x, y };
            return true;
          }
        }
        // Fallback scan
        for (let y = 0; y < ROWS; y++) {
          for (let x = 0; x < COLS; x++) {
            if (!snakeOccupies(x, y)) {
              food = { x, y };
              return true;
            }
          }
        }
        return false;
      }

      function resetGame() {
        score = 0;
        dir = { x: 1, y: 0 };
        pendingDir = null;
        gameOver = false;

        // Start snake centered, length 4, moving right
        const startX = Math.floor(COLS / 2) - 1;
        const startY = Math.floor(ROWS / 2);

        snake = [
          { x: startX + 2, y: startY },
          { x: startX + 1, y: startY },
          { x: startX,     y: startY },
          { x: startX - 1, y: startY }
        ];

        placeFood();
        updateScoreUI();
        draw(true);
      }

      function startGame() {
        // If modal is open, close it.
        try { gameOverModalEl.close(); } catch (_) {}
        try { winModalEl.close(); } catch (_) {}

        resetGame();
        running = true;
        scheduleNextTick();
      }

      function endGame() {
        running = false;
        gameOver = true;
        clearTimer();

        if (score > highScore) highScore = score;
        updateScoreUI();

        finalScoreEl.textContent = String(score);
        finalHighScoreEl.textContent = String(highScore);
        gameOverModalEl.showModal();
      }

      function winGame() {
        running = false;
        gameOver = true;
        clearTimer();

        if (score > highScore) highScore = score;
        updateScoreUI();

        winScoreEl.textContent = String(score);
        winHighScoreEl.textContent = String(highScore);
        winModalEl.showModal();
      }

      function tryQueueDirection(next) {
        // Prevent reversing into itself: disallow exact opposite of current direction
        if (next.x === -dir.x && next.y === -dir.y) return;
        pendingDir = next;
      }

      // ====== Input ======
      function handleKeyDown(e) {
        const key = e.key;

        // Start trigger when not running (either fresh or after game over)
        if (!running && (key === ' ' || key === 'Enter')) {
          e.preventDefault();
          startGame();
          return;
        }

        // During game, block page scroll on arrows/space
        if (key === ' ' || key.startsWith('Arrow')) e.preventDefault();

        if (!running) return; // ignore movement keys when not running

        if (controlMode === 'arrows') {
          if (key === 'ArrowUp')    tryQueueDirection({ x: 0, y: -1 });
          if (key === 'ArrowDown')  tryQueueDirection({ x: 0, y:  1 });
          if (key === 'ArrowLeft')  tryQueueDirection({ x: -1, y: 0 });
          if (key === 'ArrowRight') tryQueueDirection({ x:  1, y: 0 });
        } else {
          // Vim classic lowercase only: h j k l
          if (key === 'k') tryQueueDirection({ x: 0, y: -1 });
          if (key === 'j') tryQueueDirection({ x: 0, y:  1 });
          if (key === 'h') tryQueueDirection({ x: -1, y: 0 });
          if (key === 'l') tryQueueDirection({ x:  1, y: 0 });
        }
      }

      document.addEventListener('keydown', handleKeyDown, { passive: false });

      controlsArrows.addEventListener('change', () => {
        if (controlsArrows.checked) setControlMode('arrows');
      });
      controlsVi.addEventListener('change', () => {
        if (controlsVi.checked) setControlMode('vi');
      });

      document.getElementById('startGameBtn').addEventListener('click', startGame)
      document.querySelectorAll('[data-close-dialog]').forEach(button => {
        button.addEventListener('click', () => button.closest('dialog').close())
      })
      const touchDirections = { up: { x: 0, y: -1 }, down: { x: 0, y: 1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 } }
      document.querySelectorAll('[data-direction]').forEach(button => {
        button.addEventListener('click', () => {
          if (running) tryQueueDirection(touchDirections[button.dataset.direction])
        })
      })

      playAgainBtn.addEventListener('click', () => startGame());
      winPlayAgainBtn.addEventListener('click', () => startGame());

      // ====== Game Loop ======
      function tick() {
        if (!running) return;

        if (pendingDir) {
          dir = pendingDir;
          pendingDir = null;
        }

        const head = snake[0];
        const nextHead = { x: head.x + dir.x, y: head.y + dir.y };

        // Wrap around edges
        if (nextHead.x < 0) nextHead.x = COLS - 1;
        else if (nextHead.x >= COLS) nextHead.x = 0;
        if (nextHead.y < 0) nextHead.y = ROWS - 1;
        else if (nextHead.y >= ROWS) nextHead.y = 0;

        // Self collision: note that moving into the last tail cell is OK IF tail moves away this tick.
        // We'll compute the new body accordingly.
        const willEat = cellEquals(nextHead, food);

        // Build new snake:
        const newSnake = [nextHead, ...snake];

        if (!willEat) {
          newSnake.pop(); // move forward, drop tail
        }

        // Check self collision after adjusting tail
        for (let i = 1; i < newSnake.length; i++) {
          if (cellEquals(newSnake[i], nextHead)) {
            endGame();
            return;
          }
        }

        snake = newSnake;

        if (willEat) {
          score += 1;
          if (score > highScore) highScore = score;
          const placed = placeFood();
          updateScoreUI();
          if (!placed) {
            winGame();
            return;
          }
        }

        draw(false);
      }

      // ====== Rendering ======
      function draw(showStartOverlay) {
        // Background
        ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);

        // Subtle grid
        ctx.save();
        ctx.globalAlpha = 0.18;
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1;
        for (let x = 0; x <= COLS; x++) {
          ctx.beginPath();
          ctx.moveTo(x * CELL + 0.5, 0);
          ctx.lineTo(x * CELL + 0.5, CANVAS_H);
          ctx.stroke();
        }
        for (let y = 0; y <= ROWS; y++) {
          ctx.beginPath();
          ctx.moveTo(0, y * CELL + 0.5);
          ctx.lineTo(CANVAS_W, y * CELL + 0.5);
          ctx.stroke();
        }
        ctx.restore();

        // Food
        drawCell(food.x, food.y, '#f97316', true);

        // Snake
        for (let i = snake.length - 1; i >= 0; i--) {
          const seg = snake[i];
          const isHead = (i === 0);
          drawCell(seg.x, seg.y, isHead ? '#ede4cc' : '#9faa80', false, isHead);
        }

        // Overlay prompt when not running and not game over modal
        if (showStartOverlay && !running) {
          ctx.save();
          ctx.fillStyle = 'rgba(0,0,0,0.35)';
          ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

          ctx.fillStyle = 'rgba(255,255,255,0.92)';
          ctx.font = 'bold 16px system-ui, -apple-system, Segoe UI, Roboto, Arial';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          const line1 = 'Press Start, Space or Enter';
          const line2 = 'to Start';
          ctx.fillText(line1, CANVAS_W / 2, CANVAS_H / 2 - 10);
          ctx.font = '14px system-ui, -apple-system, Segoe UI, Roboto, Arial';
          ctx.fillText(line2, CANVAS_W / 2, CANVAS_H / 2 + 12);
          ctx.restore();
        }
      }

      function drawCell(x, y, fill, isFood, isHead = false) {
        const px = x * CELL;
        const py = y * CELL;

        // Cell padding for a “chunky” look
        const pad = 2;
        const w = CELL - pad * 2;
        const h = CELL - pad * 2;

        // Body
        ctx.save();
        ctx.fillStyle = fill;

        const radius = isFood ? 6 : (isHead ? 6 : 5);
        roundRect(px + pad, py + pad, w, h, radius);
        ctx.fill();

        // Simple highlight
        ctx.globalAlpha = 0.18;
        ctx.fillStyle = '#ffffff';
        roundRect(px + pad + 2, py + pad + 2, Math.max(0, w - 4), Math.max(0, h - 6), Math.max(2, radius - 2));
        ctx.fill();

        ctx.restore();
      }

      function roundRect(x, y, w, h, r) {
        const rr = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + rr, y);
        ctx.arcTo(x + w, y, x + w, y + h, rr);
        ctx.arcTo(x + w, y + h, x, y + h, rr);
        ctx.arcTo(x, y + h, x, y, rr);
        ctx.arcTo(x, y, x + w, y, rr);
        ctx.closePath();
      }

      // ====== Init ======
      setControlMode('vi');
      resetGame();

      // Ensure the overlay is visible on first load
      draw(true);

    })();
  </script>
</body>
</html>
