<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Interval Timer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="resources/98-css/98.css">

  <style>
    :root {
      color-scheme: light;
    }

    body {
      box-sizing: border-box;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      background: #008080;
    }

    .tool-page {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: calc(100vh - 32px);
    }

    .window {
      width: min(100%, 560px);
    }

    .window-body {
      padding: 16px;
    }

    .timer-settings {
      margin: 0;
    }

    .timer-settings .field-row {
      max-width: 360px;
      margin: 8px auto;
    }

    .timer-settings input {
      width: 100%;
      min-height: 32px;
    }

    .timer-display {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin: 16px 0;
      padding: 16px;
      text-align: center;
    }

    .phase-badge {
      min-width: 96px;
      padding: 6px 12px;
      border: 1px solid #222;
      font-weight: bold;
    }

    .phase-active {
      background: #0dcaf0;
      color: #000;
    }

    .phase-rest {
      background: #6c757d;
      color: #fff;
    }

    #display {
      margin: 0;
      font-size: clamp(2.5rem, 12vw, 4rem);
      line-height: 1;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .action-row,
    .options-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .action-row button {
      min-height: 36px;
      min-width: 96px;
    }

    .timer-options {
      margin: 16px 0 0;
    }

    .option {
      display: flex;
      align-items: center;
      min-height: 36px;
    }

    .option input {
      width: 18px;
      height: 18px;
      margin: 0 8px 0 0;
    }

    .option label {
      padding: 8px 0;
      cursor: pointer;
    }

    @media (max-width: 520px) {
      body {
        padding: 8px;
      }

      .tool-page {
        min-height: calc(100vh - 16px);
      }

      .window-body {
        padding: 12px 8px;
      }

      .options-row {
        display: block;
      }

      .option {
        justify-content: center;
        margin: 4px 0;
      }
    }
  </style>
</head>
<body>
<main class="tool-page">
  <div class="window">
    <div class="title-bar">
      <div class="title-bar-text">Interval Timer</div>
    </div>
    <div class="window-body">
      <fieldset class="timer-settings">
        <legend>Timer settings</legend>
        <div class="field-row">
          <label for="active-seconds">Active seconds</label>
          <input id="active-seconds" type="number" value="50" min="0">
        </div>
        <div class="field-row">
          <label for="rest-seconds">Rest seconds</label>
          <input id="rest-seconds" type="number" value="10" min="0">
        </div>
      </fieldset>

      <section class="timer-display sunken-panel" aria-label="Timer status">
        <span id="phase" class="phase-badge phase-active">Active</span>
        <output id="display">00:30</output>
        <span id="timer-announcement" class="visually-hidden" aria-live="polite"></span>
      </section>

      <div class="action-row">
        <button id="start" class="default">Start</button>
        <button id="reset">Reset</button>
      </div>

      <fieldset class="timer-options">
        <legend>Options</legend>
        <div class="options-row">
          <div class="option">
            <input type="checkbox" id="repeatToggle" checked>
            <label for="repeatToggle">Auto repeat</label>
          </div>
          <div class="option">
            <input type="checkbox" id="wakeLockToggle" checked>
            <label for="wakeLockToggle">Keep screen awake</label>
          </div>
        </div>
      </fieldset>
    </div>
  </div>
</main>

<script>
  const display = document.getElementById("display");
  const phaseEl = document.getElementById("phase");
  const timerAnnouncement = document.getElementById("timer-announcement");
  const repeatToggle = document.getElementById("repeatToggle");
  const wakeLockToggle = document.getElementById("wakeLockToggle");
  const startBtn = document.getElementById("start");
  const resetBtn = document.getElementById("reset");
  let timerId = null;
  let remaining = 0;
  let phase = "active";
  let wakeLock = null;
  let audioCtx = null;

  async function getAudioContext() {
    // Safari on iOS requires audio contexts to be created/resumed inside
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") await audioCtx.resume();
    return audioCtx;
  }

  async function ensureAudioSession() {
    // iOS Audio Session API: use a transient session so beeps can play over other audio
    if (!navigator.audioSession) return;
    try {
      navigator.audioSession.type = "transient";
    } catch (err) {
      // Best effort; ignore failures on unsupported browsers.
    }
  }

  function totalSeconds(kind) {
    return +document.getElementById(`${kind}-seconds`).value || 0;
  }

  function setPhase(next) {
    phase = next;
    phaseEl.textContent = next === "active" ? "Active" : "Rest";
    timerAnnouncement.textContent = `${phaseEl.textContent} interval`;
    phaseEl.className =
      "phase-badge " +
      (next === "active" ? "phase-active" : "phase-rest");
  }

  function updateDisplay() {
    const m = Math.floor(remaining / 60);
    const s = remaining % 60;
    display.textContent =
      String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
  }

  async function playBeep() {
    // Use Web Audio to avoid data-URI decoding issues in some browsers.
    const ctx = await getAudioContext();
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(10, now);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.3);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.35);
  }

  async function requestWakeLock(enabled) {
    if (!("wakeLock" in navigator)) return;

    if (enabled) {
      wakeLock = await navigator.wakeLock.request("screen");
    } else if (wakeLock) {
      await wakeLock.release();
      wakeLock = null;
    }
  }

  function startPhase(kind) {
    remaining = totalSeconds(kind);
    if (remaining <= 0) return false;

    setPhase(kind);
    updateDisplay();
    clearInterval(timerId);

    timerId = setInterval(() => {
      remaining--;
      updateDisplay();

      if (remaining <= 0) {
        clearInterval(timerId);
        playBeep();
        handleCompletion();
      }
    }, 1000);

    return true;
  }

  function handleCompletion() {
    if (phase === "active" && totalSeconds("rest") > 0) {
      if (startPhase("rest")) return;
    }

    if (repeatToggle.checked) {
      startPhase("active");
      return;
    }

    timerAnnouncement.textContent = "Timer complete";
  }

  startBtn.onclick = async () => {
    await getAudioContext();
    await ensureAudioSession();
    playBeep();
    startPhase("active");
  };

  resetBtn.onclick = () => {
    clearInterval(timerId);
    timerId = null;
    setPhase("active");
    remaining = totalSeconds("active");
    updateDisplay();
  };

  wakeLockToggle.onchange = (e) => {
    requestWakeLock(e.target.checked);
  };

  // Attempt wake lock on load to match default checked state.
  (async () => {
    try {
      await requestWakeLock(true);
    } catch (err) {
      // If wake lock fails (permissions/device), revert toggle to reflect reality.
      wakeLockToggle.checked = false;
    }
  })();
</script>

</body>
</html>
