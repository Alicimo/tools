<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Mermaid Canvas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="resources/tools.css">

  <!-- Mermaid -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

  <style>
    .tool-shell {
      max-width: 1200px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin: 24px 0;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--tool-border);
    }

    .scale-field {
      margin-left: auto;
    }

    .scale-field input {
      width: 70px;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 28px;
    }

    .editor-column, .preview-column {
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 0;
    }

    .workspace fieldset {
      min-width: 0;
      margin: 0;
    }

    .editor-field, .preview-field {
      flex: 1;
    }

    #input {
      display: block;
      width: 100%;
      min-height: 320px;
      resize: vertical;
      font-family: ui-monospace, monospace;
    }

    #preview {
      min-height: 300px;
      padding: 12px 0;
      overflow: auto;
    }

    #preview svg {
      max-width: 100%;
      height: auto;
    }

    #errorBox {
      min-height: 42px;
      margin: 0;
      color: var(--tool-danger);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    @media (max-width: 760px) {
      .workspace {
        grid-template-columns: 1fr;
      }
      .scale-field {
        margin-left: 0;
      }
    }
  </style>
</head>

<body>
  <nav class="tool-nav" aria-label="Tools">
    <a class="tool-brand" href="index.html">Personal tools</a>
    <a class="tool-home" href="index.html">All tools</a>
  </nav>
<main class="tool-page">
  <div class="tool-shell">
    <div class="tool-content">
      <h1>Mermaid canvas</h1>
      <div class="toolbar">
        <button id="renderBtn" class="default">Render</button>
        <button id="copyBtn" disabled>Copy PNG</button>
        <button id="downloadBtn" disabled>Download PNG</button>
        <div class="field-row scale-field">
          <label for="scaleInput">Scale</label>
          <input id="scaleInput" type="number" value="2" min="0.5" max="5" step="0.5">
        </div>
      </div>

      <div class="workspace">
        <div class="editor-column">
          <fieldset class="editor-field">
            <legend>Mermaid input</legend>
            <textarea id="input" rows="14"></textarea>
          </fieldset>

          <fieldset class="errors-field">
            <legend>Errors</legend>
            <pre id="errorBox">(none)</pre>
          </fieldset>
        </div>

        <div class="preview-column">
          <fieldset class="preview-field">
            <legend>Preview</legend>
            <div id="preview" class="surface"></div>
          </fieldset>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
  const themeStyles = getComputedStyle(document.documentElement)
  mermaid.initialize({
    startOnLoad: false,
    theme: 'base',
    themeVariables: {
      primaryColor: themeStyles.getPropertyValue('--tool-subtle').trim(),
      primaryTextColor: themeStyles.getPropertyValue('--tool-text').trim(),
      primaryBorderColor: themeStyles.getPropertyValue('--tool-border').trim(),
      lineColor: themeStyles.getPropertyValue('--tool-accent').trim(),
      secondaryColor: '#efede7',
      tertiaryColor: '#fff',
      fontFamily: 'system-ui, sans-serif'
    },
    securityLevel: "strict"
  });

  const example = `flowchart TD
    A[Write Mermaid] --> B[Render]
    B --> C{Looks OK?}
    C -- Yes --> D[Copy or Download PNG]
    C -- No --> E[Fix Diagram]
    E --> B
  `;

  const input = document.getElementById("input");
  const preview = document.getElementById("preview");
  const errorBox = document.getElementById("errorBox");
  const renderBtn = document.getElementById("renderBtn");
  const copyBtn = document.getElementById("copyBtn");
  const downloadBtn = document.getElementById("downloadBtn");
  const scaleInput = document.getElementById("scaleInput");

  input.value = example;

  function setError(msg) {
    errorBox.textContent = msg || "(none)";
  }

  function getSvg() {
    return preview.querySelector("svg");
  }

  async function render() {
    setError("");
    preview.innerHTML = "";
    copyBtn.disabled = true;
    downloadBtn.disabled = true;

    const code = input.value.trim();
    if (!code) {
      setError("Input is empty.");
      return;
    }

    try {
      const id = "mmd-" + crypto.randomUUID();
      // mermaid.render returns an object, but we only need the svg string.
      const svg = (await mermaid.render(id, code)).svg;
      preview.innerHTML = svg;

      const svgEl = getSvg();
      svgEl.style.background = "white";
      svgEl.setAttribute("xmlns", "http://www.w3.org/2000/svg");

      copyBtn.disabled = false;
      downloadBtn.disabled = false;
    } catch (e) {
      setError(e.message || String(e));
    }
  }

  function getScale() {
    const val = parseFloat(scaleInput.value);
    return Number.isFinite(val) && val > 0 ? val : 2;
  }

  function svgToPngBlob(svgEl, scale = 2) {
    return new Promise((resolve, reject) => {
      // Responsive SVGs have no intrinsic pixel size when loaded as an image.
      // Export the diagram's viewBox rather than the browser's 300 × 150 fallback.
      const bounds = svgEl.viewBox.baseVal
      const width = bounds.width || svgEl.getBoundingClientRect().width
      const height = bounds.height || svgEl.getBoundingClientRect().height
      const exportSvg = svgEl.cloneNode(true)
      exportSvg.setAttribute('width', width)
      exportSvg.setAttribute('height', height)
      exportSvg.style.maxWidth = 'none'
      const svgData = new XMLSerializer().serializeToString(exportSvg);
      // A data URL lets Chrome export SVGs containing Mermaid's HTML labels.
      const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgData)

      const img = new Image();
      img.onload = () => {
        const w = Math.ceil(width * scale);
        const h = Math.ceil(height * scale);

        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;

        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "white";
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);

        canvas.toBlob(blob => {
          blob ? resolve(blob) : reject("PNG export failed");
        }, "image/png");
      };

      img.onerror = reject;
      img.src = url;
    });
  }

  renderBtn.onclick = render;

  downloadBtn.onclick = async () => {
    const svg = getSvg();
    if (!svg) return;

    const blob = await svgToPngBlob(svg, getScale());
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "mermaid-diagram.png";
    a.click();
    URL.revokeObjectURL(a.href);
  };

  copyBtn.onclick = async () => {
    const svg = getSvg();
    if (!svg) return;

    try {
      const blob = await svgToPngBlob(svg, getScale());
      await navigator.clipboard.write([
        new ClipboardItem({ "image/png": blob })
      ]);
    } catch (e) {
      setError(
        "Clipboard copy failed. Firefox requires HTTPS or localhost.\n" +
        (e.message || e)
      );
    }
  };

  // Render example immediately
  render();
</script>
</body>
</html>
