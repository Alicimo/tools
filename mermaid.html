<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Mermaid Canvas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="resources/98-css/98.css">

  <!-- Mermaid -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

  <style>
    body {
      box-sizing: border-box;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      background: #008080;
    }

    .tool-page {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: calc(100vh - 32px);
    }

    .window {
      width: min(100%, 1100px);
    }

    .window-body {
      padding: 16px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding-bottom: 12px;
      border-bottom: 1px solid #808080;
    }

    .toolbar button {
      min-height: 36px;
    }

    .scale-field {
      margin-left: auto;
    }

    .scale-field input {
      width: 70px;
      min-height: 32px;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 12px;
      margin-top: 12px;
    }

    .editor-column,
    .preview-column {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 0;
    }

    .workspace fieldset {
      min-width: 0;
      margin: 0;
    }

    .editor-field,
    .preview-field {
      flex: 1;
    }

    #input {
      display: block;
      box-sizing: border-box;
      width: 100%;
      min-height: 280px;
      resize: vertical;
      font-family: monospace;
    }

    #preview {
      min-height: 260px;
      padding: 16px;
      background: #fff;
      overflow: auto;
    }

    #preview svg {
      max-width: 100%;
      height: auto;
    }

    #errorBox {
      min-height: 42px;
      margin: 0;
      color: #800000;
      white-space: pre-wrap;
      word-break: break-word;
    }

    @media (max-width: 760px) {
      body {
        padding: 8px;
      }

      .tool-page {
        min-height: calc(100vh - 16px);
      }

      .window-body {
        padding: 12px 8px;
      }

      .workspace {
        grid-template-columns: 1fr;
      }

      .scale-field {
        margin-left: 0;
      }
    }
  </style>
</head>

<body>
<main class="tool-page">
  <div class="window">
    <div class="title-bar">
      <div class="title-bar-text">Mermaid Canvas</div>
    </div>
    <div class="window-body">
      <div class="toolbar">
        <button id="renderBtn" class="default">Render</button>
        <button id="copyBtn" disabled>Copy PNG</button>
        <button id="downloadBtn" disabled>Download PNG</button>
        <div class="field-row scale-field">
          <label for="scaleInput">Scale</label>
          <input id="scaleInput" type="number" value="2" min="0.5" max="5" step="0.5">
        </div>
      </div>

      <div class="workspace">
        <div class="editor-column">
          <fieldset class="editor-field">
            <legend>Mermaid input</legend>
            <textarea id="input" rows="14"></textarea>
          </fieldset>

          <fieldset class="errors-field">
            <legend>Errors</legend>
            <pre id="errorBox">(none)</pre>
          </fieldset>
        </div>

        <div class="preview-column">
          <fieldset class="preview-field">
            <legend>Preview</legend>
            <div id="preview" class="sunken-panel"></div>
          </fieldset>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
  mermaid.initialize({
    startOnLoad: false,
    theme: "default",
    securityLevel: "strict"
  });

  const example = `flowchart TD
    A[Write Mermaid] --> B[Render]
    B --> C{Looks OK?}
    C -- Yes --> D[Copy or Download PNG]
    C -- No --> E[Fix Diagram]
    E --> B
  `;

  const input = document.getElementById("input");
  const preview = document.getElementById("preview");
  const errorBox = document.getElementById("errorBox");
  const renderBtn = document.getElementById("renderBtn");
  const copyBtn = document.getElementById("copyBtn");
  const downloadBtn = document.getElementById("downloadBtn");
  const scaleInput = document.getElementById("scaleInput");

  input.value = example;

  function setError(msg) {
    errorBox.textContent = msg || "(none)";
  }

  function getSvg() {
    return preview.querySelector("svg");
  }

  async function render() {
    setError("");
    preview.innerHTML = "";
    copyBtn.disabled = true;
    downloadBtn.disabled = true;

    const code = input.value.trim();
    if (!code) {
      setError("Input is empty.");
      return;
    }

    try {
      const id = "mmd-" + crypto.randomUUID();
      // mermaid.render returns an object, but we only need the svg string.
      const svg = (await mermaid.render(id, code)).svg;
      preview.innerHTML = svg;

      const svgEl = getSvg();
      svgEl.style.background = "white";
      svgEl.setAttribute("xmlns", "http://www.w3.org/2000/svg");

      copyBtn.disabled = false;
      downloadBtn.disabled = false;
    } catch (e) {
      setError(e.message || String(e));
    }
  }

  function getScale() {
    const val = parseFloat(scaleInput.value);
    return Number.isFinite(val) && val > 0 ? val : 2;
  }

  function svgToPngBlob(svgEl, scale = 2) {
    return new Promise((resolve, reject) => {
      const svgData = new XMLSerializer().serializeToString(svgEl);
      const svgBlob = new Blob([svgData], { type: "image/svg+xml" });
      const url = URL.createObjectURL(svgBlob);

      const img = new Image();
      img.onload = () => {
        const w = img.width * scale;
        const h = img.height * scale;

        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;

        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "white";
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);

        URL.revokeObjectURL(url);

        canvas.toBlob(blob => {
          blob ? resolve(blob) : reject("PNG export failed");
        }, "image/png");
      };

      img.onerror = reject;
      img.src = url;
    });
  }

  renderBtn.onclick = render;

  downloadBtn.onclick = async () => {
    const svg = getSvg();
    if (!svg) return;

    const blob = await svgToPngBlob(svg, getScale());
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "mermaid-diagram.png";
    a.click();
    URL.revokeObjectURL(a.href);
  };

  copyBtn.onclick = async () => {
    const svg = getSvg();
    if (!svg) return;

    try {
      const blob = await svgToPngBlob(svg, getScale());
      await navigator.clipboard.write([
        new ClipboardItem({ "image/png": blob })
      ]);
    } catch (e) {
      setError(
        "Clipboard copy failed. Firefox requires HTTPS or localhost.\n" +
        (e.message || e)
      );
    }
  };

  // Render example immediately
  render();
</script>
</body>
</html>
